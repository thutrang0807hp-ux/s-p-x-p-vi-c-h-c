<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8f3" />
    <title>Nhịp học · Không gian học của bạn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;450;500;550;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/tabler.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#home"
        ><span class="brandmark"
          ><svg class="ui-icon" aria-hidden="true">
            <use href="vendor/icons.svg#layers-linked"></use></svg
        ></span>
        nhịp học <span class="beta">STUDIO</span></a
      >
      <div class="workspace">KHÔNG GIAN CHUNG</div>
      <nav id="globalnav">
        <button data-page="home" aria-label="Tổng quan" title="Tổng quan">
          <svg class="ui-icon" aria-hidden="true">
            <use href="vendor/icons.svg#layout-dashboard"></use></svg
          ><span>Tổng quan</span></button
        ><button
          data-page="library"
          aria-label="Thư viện tài liệu"
          title="Thư viện tài liệu"
        >
          <svg class="ui-icon" aria-hidden="true">
            <use href="vendor/icons.svg#books"></use></svg
          ><span>Thư viện tài liệu</span
          ><small id="fileCount">11</small></button
        ><button
          data-page="schedule"
          aria-label="Lịch và Telegram"
          title="Lịch và Telegram"
        >
          <svg class="ui-icon" aria-hidden="true">
            <use href="vendor/icons.svg#calendar"></use></svg
          ><span>Lịch & Telegram</span></button
        ><button
          data-page="profile"
          aria-label="Hồ sơ và sao lưu"
          title="Hồ sơ và sao lưu"
        >
          <svg class="ui-icon" aria-hidden="true">
            <use href="vendor/icons.svg#notes"></use></svg
          ><span>Hồ sơ & sao lưu</span>
        </button>
      </nav>
      <div class="subject-nav">
        <div class="subject-heading">
          <span class="tiny">CÁC MÔN CỦA BẠN</span
          ><button data-action="newCourse" aria-label="Thêm môn học">+</button>
        </div>
        <div id="courseNav"></div>
        <button class="addcourse" data-action="newCourse">
          + Thêm môn học
        </button>
      </div>
      <div class="sidebottom">
        <div class="connection"><i></i> Bản thử · lưu trên trình duyệt</div>
        <div class="profile">
          <span>M</span>
          <div>Không gian của Minh<small>Mỗi môn một hành trình</small></div>
          <button data-action="reset" title="Đặt lại dữ liệu mẫu">↺</button>
        </div>
      </div>
    </aside>
    <main>
      <header>
        <span id="crumb"></span>
        <div>
          <span class="demo"><i></i> Bản thử tương tác</span
          ><button class="header-upload btn" data-action="upload">
            <svg class="ui-icon" aria-hidden="true">
              <use href="vendor/icons.svg#upload"></use>
            </svg>
            Thêm tài liệu</button
          ><span class="avatar">M</span>
        </div>
      </header>
      <div id="content"></div>
      <footer>
        <span>Nhịp học · Không gian cho sự tò mò.</span
        ><span
          >Giao diện dựa trên
          <a
            href="https://github.com/tabler/tabler"
            target="_blank"
            rel="noopener"
            >Tabler</a
          >
          · Demo</span
        >
      </footer>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <dialog id="modal"></dialog>
    <script src="vendor/fullcalendar.global.min.js"></script>
    <script src="vendor/fullcalendar.vi.js"></script>
    <script src="vendor/split.min.js"></script>
    <script src="app.js"></script>
    <script src="storage.js"></script>
    <script src="bridge.js"></script>
  </body>
</html>
